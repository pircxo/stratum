[package]
name = "stratum"
version = "0.1.0"
edition = "2021"
description = "A small columnar storage engine and SQL-subset query processor, built to learn (and demonstrate) the database-internals techniques behind systems like Snowflake: block-based columnar layout, dictionary encoding, zone-map predicate pushdown, and vectorized/parallel scanning."
license = "MIT"

[[bin]]
name = "stratum"
path = "src/bin/stratum.rs"

[[bin]]
name = "bench_prune"
path = "src/bin/bench_prune.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
